<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-Rangers – Galerie</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/nav.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/nav.js" defer></script>
<script src="/js/galerie.js" defer></script>
</head>

<body>
<div class="page-wrapper">

<h1 id="galerie-titel">Galerie</h1>

<div style="text-align: center; margin-bottom: 20px;">
    <button id="toggleAllBtn" onclick="toggleAllCheckboxes()">Alle auswählen</button>
    <button onclick="downloadSelected()">Ausgewählte Bilder herunterladen</button>
    <button id="toggleControlsBtn" onclick="toggleMobileControls()"><i class="fas fa-check-square"></i> Auswählen einblenden</button>
</div>

<div id="gallery" class="gallery"></div>

<div id="lightbox" class="lightbox hidden">
    <span class="lightbox-close"><i class="fas fa-times"></i></span>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-nav">
        <span class="lightbox-prev"><i class="fas fa-chevron-left"></i></span>
        <span class="lightbox-next"><i class="fas fa-chevron-right"></i></span>
    </div>
    <button id="lightbox-download-btn" class="download-btn">Bild herunterladen</button>
</div>

<button id="scrollTopBtn" title="Nach oben scrollen"><i class="fas fa-arrow-up"></i></button>

</div>

<div id="downloadModal" class="modal-overlay hidden">
    <div class="modal-content">
        <span class="modal-close" onclick="closeDownloadModal()"><i class="fas fa-times"></i></span>
        <h3 id="modalTitle">Hinweis</h3>
        <div id="modalBody"></div>
        <div style="margin-top: 20px;">
            <button id="startDownloadBtn" class="download-btn">Download starten</button>
        </div>
    </div>
</div>

</body>
</html>
