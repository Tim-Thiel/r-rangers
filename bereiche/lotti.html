<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-Rangers – Lotti</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="../css/style.css">
<script src="/js/auth.js"></script>
<script src="/js/nav.js" defer></script>
</head>

<body>

<div id="lotti-gate" class="modal-overlay">
    <div class="modal-content">
        <span id="lotti-gate-close" class="modal-close"><i class="fas fa-times"></i></span>
        <h3><i class="fas fa-lock"></i> Passwort erforderlich</h3>
        <input id="lotti-gate-input" type="password" placeholder="Passwort"
            style="width:90%; padding:10px; border-radius:8px; margin: 15px 0;">
        <div id="lotti-gate-error" style="color:#e74c3c; display:none; margin-bottom:8px;">
            <i class="fas fa-times-circle"></i> <span id="lotti-gate-error-msg">Falsches Passwort!</span>
        </div>
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <button class="download-btn btn-gray" id="lotti-gate-cancel">Abbrechen</button>
            <button class="download-btn" id="lotti-gate-btn">Öffnen</button>
        </div>
    </div>
</div>

<div class="page-wrapper">
    <h1>Lotti</h1>
    <div class="grid">

        <div class="card" onclick="location.href='/bereiche/galerie?bereich=lotti&id=erzgrube2026(handy)&titel=Erzgrube%202026%20(Handy)'">
            <img loading="lazy" src="/api/thumb.php?bereich=lotti&id=erzgrube2026(handy)&datei=PXL_20260823_173826823.jpg&w=400" alt="Erzgrube 2026 (Handy)">
            <h3>Erzgrube 2026 (Handy)</h3>
        </div>

        <div class="card" onclick="location.href='/bereiche/galerie?bereich=lotti&id=barfusspark2026(handy)&titel=Barf%C3%9Fpark%202026%20(Handy)'">
            <img loading="lazy" src="/api/thumb.php?bereich=lotti&id=barfusspark2026(handy)&datei=PXL_20260823_155147067.jpg&w=400" alt="Barfußpark 2026 (Handy)">
            <h3>Barfußpark 2026 (Handy)</h3>
        </div>

        <div class="card" onclick="location.href='/bereiche/galerie?bereich=lotti&id=hornisgrinde2026(handy)&titel=Hornisgrinde%202026%20(Handy)'">
            <img loading="lazy" src="/api/thumb.php?bereich=lotti&id=hornisgrinde2026(handy)&datei=PXL_20260816_172138646.jpg&w=400" alt="Hornisgrinde 2026 (Handy)">
            <h3>Hornisgrinde 2026 (Handy)</h3>
        </div>

    </div>
</div>

<script>
(function () {
    const gate   = document.getElementById('lotti-gate');
    const input  = document.getElementById('lotti-gate-input');
    const btn    = document.getElementById('lotti-gate-btn');
    const cancel = document.getElementById('lotti-gate-cancel');
    const close  = document.getElementById('lotti-gate-close');
    const err    = document.getElementById('lotti-gate-error');
    const errMsg = document.getElementById('lotti-gate-error-msg');

    const goHome = () => { window.location.href = '/index'; };

    function checkToday() {
        const saved = localStorage.getItem('auth_date_lotti');
        const today = new Date().toISOString().split('T')[0];
        return saved === today;
    }

    if (checkToday()) {
        gate.classList.add('hidden');
    } else {
        input.focus();
        const submit = async () => {
            const formData = new FormData();
            formData.append('area', 'lotti');
            formData.append('password', input.value);
            try {
                const res  = await fetch('/api/login.php', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.ok) {
                    const today = new Date().toISOString().split('T')[0];
                    localStorage.setItem('auth_date_lotti', today);
                    gate.classList.add('hidden');
                } else {
                    errMsg.textContent = 'Falsches Passwort!';
                    err.style.display = 'block';
                    input.value = '';
                    input.focus();
                }
            } catch {
                errMsg.textContent = 'Verbindungsfehler.';
                err.style.display = 'block';
            }
        };
        btn.addEventListener('click', submit);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        cancel.addEventListener('click', goHome);
        close.addEventListener('click', goHome);
    }
}());
</script>

</body>
</html>
